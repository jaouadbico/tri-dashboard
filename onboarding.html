<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Set Up Your Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth-common.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#141417; --panel-alt:#1c1c21; --line:#2e2e34;
    --text:#f5f5f6; --muted:#9a9aa2;
    --cyan:#e8112d; --amber:#ff6a3d; --green:#2fd88a; --red:#c81e3a;
    --radius:18px; --radius-lg:22px;
    --shadow: 0 8px 28px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  main{max-width:560px;margin:0 auto;padding:36px 20px 80px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:8px;}
  .hint{color:var(--muted);font-size:12px;margin-bottom:24px;}
  .banner{border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:20px;display:none;}
  .banner.show{display:block;}
  .banner.ok{background:rgba(47,216,138,0.12);border:1px solid rgba(47,216,138,0.4);color:var(--green);}
  .banner.err{background:rgba(200,30,58,0.12);border:1px solid rgba(200,30,58,0.4);color:#ff8a97;}
  form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
  .field .field-error{color:#ff8a97;font-size:12px;margin-top:6px;display:none;}
  .field .field-error.show{display:block;}
  input, select{
    width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel-alt);color:var(--text);font-size:16px;
  }
  input:focus, select:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .unit-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px;}
  .unit-toggle button{
    border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;
    padding:7px 16px;border-radius:999px;cursor:pointer;
  }
  .unit-toggle button.active{background:var(--cyan);color:#fff;}
  [hidden]{display:none!important;}
  .submit-btn{
    width:100%;background:var(--cyan);color:#fff;border:none;padding:16px;
    border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px;
  }
  .submit-btn:hover{filter:brightness(1.1);}
  .submit-btn:disabled{opacity:0.6;cursor:default;}
  .loading-state{text-align:center;padding:60px 20px;}
  .loading-state .spinner{
    width:36px;height:36px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--cyan);margin:0 auto 20px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <h1 id="pageTitle">Set up your dashboard</h1>
      <div class="sub">A couple of details so your dashboard feels like yours.</div>
    </div>
    <a id="signOutBtn" style="color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;white-space:nowrap;margin-top:4px;">Sign out</a>
  </div>
  <div class="hint">Takes about 30 seconds.</div>

  <div id="banner" class="banner"></div>

  <form id="onboardingForm">
    <div class="field">
      <label for="displayName">Display name</label>
      <input id="displayName" type="text" maxlength="60" autocomplete="name">
      <div class="field-error" id="err-displayName"></div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="field-error" id="err-email"></div>
    </div>

    <div class="field">
      <label for="age">Age</label>
      <input id="age" type="number" inputmode="numeric" min="10" max="100">
      <div class="field-error" id="err-age"></div>
    </div>

    <div class="field">
      <label for="sex">Sex</label>
      <select id="sex">
        <option value="">Select one&hellip;</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="prefer_not_to_say">Prefer not to say</option>
      </select>
      <div class="field-error" id="err-sex"></div>
    </div>

    <div class="field">
      <label>Height &amp; weight</label>
      <div class="unit-toggle">
        <button type="button" id="unitMetricBtn" class="active">Metric</button>
        <button type="button" id="unitImperialBtn">Imperial</button>
      </div>

      <div id="heightMetric" class="row2" style="margin-bottom:12px;">
        <div>
          <input id="heightCm" type="number" inputmode="decimal" placeholder="Height (cm)" min="100" max="230">
        </div>
        <div>
          <input id="weightKg" type="number" inputmode="decimal" placeholder="Weight (kg)" min="25" max="250">
        </div>
      </div>

      <div id="heightImperial" hidden style="margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;">
        <input id="heightFt" type="number" inputmode="numeric" placeholder="ft" min="3" max="7">
        <input id="heightIn" type="number" inputmode="numeric" placeholder="in" min="0" max="11">
        <input id="weightLb" type="number" inputmode="decimal" placeholder="Weight (lb)" min="55" max="550">
      </div>
      <div class="field-error" id="err-height"></div>
      <div class="field-error" id="err-weight"></div>
    </div>

    <div class="field">
      <label for="goal">Goal</label>
      <select id="goal">
        <option value="">Select one&hellip;</option>
        <option value="sprint_triathlon">Sprint triathlon</option>
        <option value="olympic_triathlon">Olympic triathlon</option>
        <option value="70.3">70.3</option>
        <option value="ironman">Ironman</option>
        <option value="marathon">Marathon</option>
        <option value="half_marathon">Half marathon</option>
        <option value="get_fitter">Get fitter</option>
        <option value="other">Other</option>
      </select>
      <div class="field-error" id="err-goal"></div>
    </div>

    <div class="field" id="goalOtherField" hidden>
      <label for="goalOther">Tell us your goal</label>
      <input id="goalOther" type="text" maxlength="80">
      <div class="field-error" id="err-goalOther"></div>
    </div>

    <div class="field">
      <label for="targetRaceDate">Target race date <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
      <input id="targetRaceDate" type="date">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Start my dashboard</button>
  </form>

  <div id="loadingState" class="loading-state" hidden>
    <div class="spinner"></div>
    <div id="loadingText">Pulling your Strava data&hellip;</div>
    <div id="loadingSubtext" class="hint" style="margin-top:10px;" hidden></div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://rafovizzmempbkoavnck.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pbvoqAM4PuVT3Gzg4IbDRw_q-6ySUSn";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const GOAL_LABELS = {
  sprint_triathlon: "Sprint Triathlon",
  olympic_triathlon: "Olympic Triathlon",
  "70.3": "70.3",
  ironman: "Ironman",
  marathon: "Marathon",
  half_marathon: "Half Marathon",
  get_fitter: "Get Fitter",
  other: null, // resolved from goal_other at render time
};

const el = (id) => document.getElementById(id);
let unitMode = "metric"; // "metric" | "imperial" — display only; storage is always metric
let isEditMode = false;

function showBanner(kind, text) {
  const b = el("banner");
  b.className = `banner show ${kind}`;
  b.textContent = text;
}

function setFieldError(fieldId, message) {
  const e = el(`err-${fieldId}`);
  if (!e) return;
  e.textContent = message || "";
  e.classList.toggle("show", !!message);
}

function clearAllErrors() {
  document.querySelectorAll(".field-error").forEach((e) => {
    e.textContent = "";
    e.classList.remove("show");
  });
}

function cmFromFtIn(ft, inches) {
  return Math.round(((ft * 12) + inches) * 2.54 * 10) / 10;
}
function kgFromLb(lb) {
  return Math.round(lb * 0.453592 * 10) / 10;
}
function ftInFromCm(cm) {
  const totalInches = cm / 2.54;
  const ft = Math.floor(totalInches / 12);
  const inches = Math.round(totalInches - ft * 12);
  return { ft, inches };
}
function lbFromKg(kg) {
  return Math.round((kg / 0.453592) * 10) / 10;
}

function setUnitMode(mode) {
  unitMode = mode;
  el("unitMetricBtn").classList.toggle("active", mode === "metric");
  el("unitImperialBtn").classList.toggle("active", mode === "imperial");
  el("heightMetric").hidden = mode !== "metric";
  el("heightImperial").hidden = mode === "metric";

  // Carry over whatever was already entered so switching units doesn't
  // lose the value the person just typed.
  if (mode === "imperial") {
    const cm = parseFloat(el("heightCm").value);
    if (!isNaN(cm)) {
      const { ft, inches } = ftInFromCm(cm);
      el("heightFt").value = ft;
      el("heightIn").value = inches;
    }
    const kg = parseFloat(el("weightKg").value);
    if (!isNaN(kg)) el("weightLb").value = lbFromKg(kg);
  } else {
    const ft = parseFloat(el("heightFt").value);
    const inches = parseFloat(el("heightIn").value);
    if (!isNaN(ft)) el("heightCm").value = cmFromFtIn(ft, isNaN(inches) ? 0 : inches);
    const lb = parseFloat(el("weightLb").value);
    if (!isNaN(lb)) el("weightKg").value = kgFromLb(lb);
  }
}

el("unitMetricBtn").addEventListener("click", () => setUnitMode("metric"));
el("unitImperialBtn").addEventListener("click", () => setUnitMode("imperial"));

el("goal").addEventListener("change", () => {
  el("goalOtherField").hidden = el("goal").value !== "other";
});

function getHeightCm() {
  if (unitMode === "metric") {
    const v = parseFloat(el("heightCm").value);
    return isNaN(v) ? null : v;
  }
  const ft = parseFloat(el("heightFt").value);
  const inches = parseFloat(el("heightIn").value);
  if (isNaN(ft)) return null;
  return cmFromFtIn(ft, isNaN(inches) ? 0 : inches);
}
function getWeightKg() {
  if (unitMode === "metric") {
    const v = parseFloat(el("weightKg").value);
    return isNaN(v) ? null : v;
  }
  const lb = parseFloat(el("weightLb").value);
  return isNaN(lb) ? null : kgFromLb(lb);
}

function validate() {
  clearAllErrors();
  let ok = true;

  const displayName = el("displayName").value.trim();
  if (!displayName) {
    setFieldError("displayName", "Enter a display name.");
    ok = false;
  }

  const email = el("email").value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setFieldError("email", "Enter a valid email address.");
    ok = false;
  } else if (email.toLowerCase().endsWith("@users.invalid")) {
    setFieldError("email", "Enter your real email address.");
    ok = false;
  }

  const age = parseInt(el("age").value, 10);
  if (isNaN(age) || age < 10 || age > 100) {
    setFieldError("age", "Enter an age between 10 and 100.");
    ok = false;
  }

  const sex = el("sex").value;
  if (!sex) {
    setFieldError("sex", "Pick one of the options.");
    ok = false;
  }

  const heightCm = getHeightCm();
  if (heightCm == null || heightCm < 100 || heightCm > 230) {
    setFieldError("height", unitMode === "metric"
      ? "Enter a height between 100 and 230 cm."
      : "Enter a realistic height (about 3'3\" to 7'6\").");
    ok = false;
  }

  const weightKg = getWeightKg();
  if (weightKg == null || weightKg < 25 || weightKg > 250) {
    setFieldError("weight", unitMode === "metric"
      ? "Enter a weight between 25 and 250 kg."
      : "Enter a realistic weight (about 55 to 550 lb).");
    ok = false;
  }

  const goal = el("goal").value;
  if (!goal) {
    setFieldError("goal", "Pick a goal.");
    ok = false;
  }

  let goalOther = null;
  if (goal === "other") {
    goalOther = el("goalOther").value.trim();
    if (!goalOther) {
      setFieldError("goalOther", "Tell us what you're working toward.");
      ok = false;
    }
  }

  const targetRaceDate = el("targetRaceDate").value || null;

  if (!ok) return null;
  return { displayName, email, age, sex, heightCm, weightKg, goal, goalOther, targetRaceDate };
}

function showLoading(text, subtext) {
  el("onboardingForm").hidden = true;
  el("loadingState").hidden = false;
  el("loadingText").textContent = text;
  el("loadingSubtext").hidden = !subtext;
  if (subtext) el("loadingSubtext").textContent = subtext;
}

const PENDING_EMAIL_NOTE = "Check your inbox to confirm your email so you can sign in with it later.";

el("onboardingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const values = validate();
  if (!values) return;

  const btn = el("submitBtn");
  btn.disabled = true;

  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    location.href = "connect.html";
    return;
  }

  const { error: upsertErr } = await sb.from("profiles").upsert({
    user_id: user.id,
    display_name: values.displayName,
    age: values.age,
    sex: values.sex,
    height_cm: values.heightCm,
    weight_kg: values.weightKg,
    goal: values.goal,
    goal_other: values.goalOther,
    target_race_date: values.targetRaceDate,
    updated_at: new Date().toISOString(),
  }, { onConflict: "user_id" });

  if (upsertErr) {
    console.error("profile upsert failed", upsertErr);
    btn.disabled = false;
    showBanner("err", "Couldn't save your profile — try again.");
    return;
  }

  // Email is independent of the profile row — a real address isn't
  // required to already match before onboarding can be saved, only to be
  // provided. Only touch auth if it actually changed, to avoid sending a
  // pointless reconfirmation email every time the form is re-saved.
  let emailPending = false;
  if (values.email.toLowerCase() !== (user.email || "").toLowerCase()) {
    const { error: emailErr } = await sb.auth.updateUser({ email: values.email });
    if (emailErr) {
      console.error("email update failed", emailErr);
      showBanner("err", `Couldn't update your email: ${emailErr.message}`);
    } else {
      emailPending = true;
    }
  }

  if (isEditMode) {
    if (emailPending) {
      showBanner("ok", `Profile saved. ${PENDING_EMAIL_NOTE}`);
      setTimeout(() => { location.href = "index.html"; }, 1800);
    } else {
      location.href = "index.html";
    }
    return;
  }

  showLoading("Pulling your Strava data…", emailPending ? PENDING_EMAIL_NOTE : null);
  try {
    const { error: syncErr } = await sb.functions.invoke("strava-sync", { body: { days: 90 } });
    if (syncErr) console.error("initial sync failed", syncErr);
  } catch (err) {
    console.error("initial sync threw", err);
  }
  location.href = "index.html";
});

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    location.href = "connect.html";
    return;
  }

  // @users.invalid is the placeholder this app assigns Strava-login-created
  // accounts until they set a real address — never show it as if it were one.
  if (user.email && !user.email.toLowerCase().endsWith("@users.invalid")) {
    el("email").value = user.email;
  }

  const { data: profile, error } = await sb.from("profiles").select("*").maybeSingle();
  if (error) console.error("profile lookup failed", error);

  if (profile) {
    isEditMode = true;
    el("pageTitle").textContent = "Edit your profile";
    el("submitBtn").textContent = "Save changes";
    el("displayName").value = profile.display_name || "";
    el("age").value = profile.age ?? "";
    el("sex").value = profile.sex || "";
    el("heightCm").value = profile.height_cm ?? "";
    el("weightKg").value = profile.weight_kg ?? "";
    el("goal").value = profile.goal || "";
    if (profile.goal === "other") {
      el("goalOtherField").hidden = false;
      el("goalOther").value = profile.goal_other || "";
    }
    el("targetRaceDate").value = profile.target_race_date || "";
  } else {
    // First-time onboarding: prefill the display name from Strava, if a
    // "Continue with Strava" login just happened (see connect.html).
    try {
      const firstName = sessionStorage.getItem("strava_prefill_first_name") || "";
      const lastName = sessionStorage.getItem("strava_prefill_last_name") || "";
      const full = `${firstName} ${lastName}`.trim();
      if (full) el("displayName").value = full;
      sessionStorage.removeItem("strava_prefill_first_name");
      sessionStorage.removeItem("strava_prefill_last_name");
    } catch (e) {
      // sessionStorage unavailable (private browsing etc.) — fine, just skip prefill
    }
  }
}
init();

el("signOutBtn").addEventListener("click", () => signOutEverywhere(sb));
</script>
</body>
</html>
