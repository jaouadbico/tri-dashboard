<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jaouad's 70.3 — Program</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="70.3 Plan">
<meta name="theme-color" content="#0a0a0c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#141417; --panel-alt:#1c1c21; --line:#2e2e34;
    --text:#f5f5f6; --muted:#9a9aa2;
    --cyan:#4d94ff; --amber:#ff6a3d; --blue:#f5f5f6; --slate:#9a9aa2; --red:#c81e3a; --green:#34c759;
    --purple:#8a1c2b; --purple-bright:#c23b52; --yellow:#e8c547;
    --radius:18px; --radius-lg:22px;
    --shadow: 0 8px 28px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       background-image:radial-gradient(circle at 12% 0%, rgba(77,148,255,0.12), transparent 40%),
                         radial-gradient(circle at 88% 6%, rgba(255,255,255,0.05), transparent 38%),
                         radial-gradient(circle at 50% 100%, rgba(138,28,43,0.10), transparent 45%);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.02em;}
  a{color:var(--cyan);text-decoration:none;}

  header{margin:calc(env(safe-area-inset-top,0px) + 10px) 10px 14px;padding:12px 16px;border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:linear-gradient(180deg, var(--panel-alt), var(--panel));box-shadow:var(--shadow);}
  @media (min-width:600px){ header{margin:22px 28px 20px;padding:14px 22px;border-radius:999px;} }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg, var(--cyan), var(--blue));box-shadow:0 0 14px rgba(77,148,255,0.55);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .brand .mark::after{content:'';width:10px;height:10px;border-radius:50%;background:#050506;}
  .brand h1{font-size:clamp(13px,3.6vw,19px);margin:0;text-transform:uppercase;letter-spacing:0.02em;}
  .brand .sub{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:0.08em;}
  @media (min-width:480px){ .brand .sub{font-size:10.5px;letter-spacing:0.1em;} }
  .nav-link{font-size:11px;border:1px solid var(--line);padding:7px 13px;border-radius:999px;color:var(--muted);white-space:nowrap;}
  @media (min-width:480px){ .nav-link{font-size:12px;padding:8px 16px;} }
  .nav-link:hover{color:var(--text);border-color:var(--muted);}

  main{max-width:1100px;margin:0 auto;padding:0 16px 60px;}
  @media (min-width:600px){ main{padding:0 28px 60px;} }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  @media (min-width:560px){ .panel{padding:22px 24px;} }
  .panel h2{font-family:'Rajdhani',sans-serif;text-transform:uppercase;font-size:14px;letter-spacing:0.06em;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .panel h2::before{content:'';width:3px;height:14px;background:var(--cyan);display:inline-block;flex-shrink:0;}

  /* Baseline strip */
  .baseline-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (min-width:600px){ .baseline-grid{grid-template-columns:repeat(4,1fr);} }
  .baseline-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .baseline-card .blabel{font-size:9.5px;text-transform:uppercase;color:var(--muted);letter-spacing:0.06em;}
  .baseline-card .bval{font-size:16px;font-weight:700;margin-top:3px;}
  .baseline-card .bnote{font-size:9.5px;color:var(--muted);margin-top:2px;}

  /* Today hero */
  .today-hero{border:1px solid #4d94ff;background:linear-gradient(160deg, rgba(77,148,255,0.10), var(--panel));}
  .today-date{font-size:11px;color:#5ba7ff;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;}
  .today-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(19px,5.5vw,26px);margin:6px 0 4px;}
  .today-detail{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
  .today-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .today-meta div{font-size:12px;}
  .today-meta .tlabel{color:var(--muted);text-transform:uppercase;font-size:9.5px;letter-spacing:0.06em;}
  .today-meta .tval{font-weight:700;font-size:14px;margin-top:2px;}
  .rest-day{font-size:15px;color:var(--muted);padding:10px 0;}

  /* Structured workout breakdown (warm-up / main set / cooldown) */
  .wo-structure{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;}
  .wo-seg{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .wo-seg:last-child{border-bottom:none;}
  .wo-seg-label{flex:0 0 92px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cyan);font-weight:700;padding-top:1px;}
  .wo-seg-text{flex:1;font-size:12.5px;color:var(--text);line-height:1.5;}

  /* Swap suggestions (easier/harder), Stamina-style */
  .swap-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .swap-box{background:var(--panel-alt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .swap-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:3px;}
  .swap-text{font-size:11.5px;color:var(--text);line-height:1.4;}

  /* Week navigator (Stamina-style) */
  .wn-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .wn-nav{display:flex;align-items:center;justify-content:center;gap:16px;}
  .wn-arrow{background:var(--panel-alt);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:16px;flex-shrink:0;}
  .wn-arrow:hover{border-color:var(--muted);}
  .wn-arrow.disabled{opacity:0.3;pointer-events:none;}
  .wn-center{text-align:center;}
  .wn-plan-label{font-size:10.5px;color:#8b7cf0;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;}
  .wn-week{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;margin:2px 0;}
  .wn-week span{color:var(--muted);font-size:15px;font-weight:600;}
  .wn-phase{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}

  .sport-ring-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 14px;}
  .sport-ring-card{display:flex;flex-direction:column;align-items:center;}
  .sport-ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:100%;}
  .sport-ring-wrap svg{width:100%;height:auto;}
  .sport-ring-icon{position:absolute;font-size:18px;top:32%;transform:translateY(-50%);}
  .sport-ring-time{font-size:12px;font-weight:700;margin-top:6px;}
  .sport-ring-target{font-size:10px;color:var(--muted);}

  .total-duration{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;}
  .total-duration b{color:var(--text);}

  /* Day list (Stamina-style workout cards) */
  .day-row{border-bottom:1px solid var(--line);padding:14px 0;}
  .day-row:last-child{border-bottom:none;}
  .day-row-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;font-weight:700;}
  .day-row-head.is-today{color:#4d94ff;}
  .wo-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;}
  .wo-card.completed{opacity:0.7;}
  .wo-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .wo-card-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;}
  .wo-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .wo-check{font-size:16px;flex-shrink:0;white-space:nowrap;}
  .wo-check[title]{font-size:11px;color:var(--green);font-weight:700;}
  .wo-tags{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
  .wo-tag{font-size:9.5px;text-transform:uppercase;font-weight:700;letter-spacing:0.03em;padding:2px 9px;border-radius:999px;}
  .wo-stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:10px;margin-top:8px;}
  .wo-stat{}
  .wo-stat-label{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  .wo-stat-val{font-size:13px;font-weight:700;margin-top:2px;}
  .wo-stat-val .unit{font-size:10px;color:var(--muted);font-weight:400;}
  .rest-mini{font-size:12px;color:var(--muted);padding:4px 0;}

  .coach-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;}
  .coach-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;}
  .coach-avatar{width:22px;height:22px;border-radius:50%;background:#8b7cf0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
  .coach-text{font-size:11.5px;color:var(--text);line-height:1.5;margin-top:6px;}

  .interval-chart-wrap{margin-top:10px;height:60px;}

  button.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04213a;border:none;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px;}
  button.primary:hover{filter:brightness(1.1);}
  button.primary.done{background:var(--panel-alt);color:var(--green);border:1px solid var(--green);}
  button.ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:12px;}
  button.ghost:hover{color:var(--text);border-color:var(--muted);}

  /* Week strip */
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  @media (max-width:700px){
    .week-strip{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
    .week-strip .day-card{flex:0 0 92px;scroll-snap-align:start;}
  }
  .day-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;}
  .day-card.today{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);}
  .day-card.done{opacity:0.55;}
  .day-card .dname{font-size:9.5px;text-transform:uppercase;color:var(--muted);letter-spacing:0.06em;}
  .day-card .ddate{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .day-card .dtag{font-size:9.5px;padding:2px 6px;border-radius:20px;font-weight:700;text-transform:uppercase;margin:6px auto 4px;display:inline-block;}
  .day-card .ddur{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .day-card .dcheck{font-size:14px;margin-top:6px;}

  .tag-run{background:rgba(52,199,89,0.18);color:#34c759;}
  .tag-bike{background:rgba(255,106,61,0.18);color:var(--amber);}
  .tag-swim{background:rgba(245,245,246,0.15);color:var(--blue);}
  .tag-strength{background:rgba(154,154,162,0.18);color:var(--slate);}
  .tag-brick{background:rgba(138,28,43,0.25);color:var(--purple-bright);}
  .tag-rest{background:rgba(255,255,255,0.06);color:var(--muted);}

  /* Phase accordion */
  .phase-accordion{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .phase-head{padding:12px 16px;background:var(--panel-alt);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .phase-head > div:first-child{min-width:0;flex:1;}
  .phase-head .pname{font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;font-size:13px;}
  .phase-head .pdate{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
  .phase-body{display:none;padding:8px 16px 14px;}
  .phase-body.open{display:block;}
  .week-row{border-bottom:1px dashed var(--line);padding:10px 0;}
  .week-row:last-child{border-bottom:none;}
  .week-row .wlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
  .sess-line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .sess-line .sname{color:var(--text);}
  .sess-line .sdur{color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .sess-struct{display:none;padding:2px 0 6px 10px;border-left:2px solid var(--line);margin:2px 0 4px;}
  .sess-struct.open{display:block;}

  .empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:20px;}

  /* Hero plan card */
  .hero-plan{background:linear-gradient(135deg, rgba(99,60,220,0.38), rgba(58,32,140,0.42));border-color:#8b7cf0;}
  .hero-plan .hlabel{font-size:11px;color:rgba(245,245,246,0.75);text-transform:uppercase;letter-spacing:0.1em;}
  .hero-plan .htitle{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(22px,6vw,30px);margin:4px 0 8px;}
  .hero-plan .hrange{font-size:12.5px;color:rgba(245,245,246,0.8);margin-bottom:14px;}
  .hero-plan .hweek{font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .hero-bar{height:6px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;}
  .hero-bar-fill{height:100%;background:var(--text);border-radius:4px;}

  /* Sport-tinted day cards (This Week strip) */
  .day-card.tint-run{background:rgba(52,199,89,0.18);border-color:rgba(52,199,89,0.4);}
  .day-card.tint-bike{background:rgba(77,148,255,0.2);border-color:rgba(77,148,255,0.45);}
  .day-card.tint-swim{background:rgba(90,200,250,0.15);border-color:rgba(90,200,250,0.35);}
  .day-card.tint-strength{background:rgba(154,154,162,0.15);border-color:rgba(154,154,162,0.35);}
  .day-card .dtag2{font-size:12px;font-weight:700;margin:6px 0 2px;}

  /* Phase badges (color per phase type, matching index.html Phase Timeline) */
  .phase-badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:3px 10px;border-radius:999px;margin-right:8px;}
  .phase-badge.foundation{background:rgba(77,148,255,0.18);color:#7cb3ff;}
  .phase-badge.base{background:rgba(77,148,255,0.22);color:#8cbfff;}
  .phase-badge.build1{background:rgba(255,169,64,0.2);color:#ffb648;}
  .phase-badge.build2{background:rgba(255,69,58,0.22);color:#ff8a80;}
  .phase-badge.taper{background:rgba(139,124,240,0.25);color:#b3a6ff;}
  .phase-marker{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:2px;}

  /* Weekly load bar inside phase accordion */
  .week-row-v2{border-bottom:1px dashed var(--line);padding:10px 0;}
  .week-row-v2:last-child{border-bottom:none;}
  .week-row-v2.is-current{background:rgba(77,148,255,0.08);border-radius:10px;padding:10px 10px;margin:0 -10px;}
  .wlh{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
  .wlh .wname{font-weight:700;}
  .wlh .wload{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .wload-bar{height:5px;background:var(--panel-alt);border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .wload-bar-fill{height:100%;background:#4d94ff;border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>70.3 Program</h1>
      <div class="sub">Built from your training data</div>
    </div>
  </div>
  <a class="nav-link" href="index.html">&larr; Stats Dashboard</a>
</header>

<main>

  <div class="panel week-nav-panel" id="weekNavPanel"></div>

  <div class="panel">
    <div id="dayList"></div>
  </div>

  <div class="panel">
    <h2>Where This Plan Starts From</h2>
    <div class="baseline-grid" id="baselineGrid"></div>
  </div>

  <div class="panel">
    <h2>Volume Roadmap</h2>
    <canvas id="roadmapChart" height="120"></canvas>
  </div>

  <div class="panel">
    <h2>Full Program</h2>
    <div style="margin-bottom:12px;"><button class="ghost" id="jumpToday">Jump to current week</button></div>
    <div id="phaseAccordions"></div>
  </div>

</main>

<footer>Program regenerates automatically from your race date and current phase &mdash; edit your race date on the Stats Dashboard and this updates too.</footer>

<script>
/* ---------------- GROUNDING DATA (from your logged history) ---------------- */
// These are the real numbers established from your Strava/WHOOP data.
// Update RACE_DATE here to match whatever's set on the Stats Dashboard.
const RACE_DATE = localStorage.getItem('atlas703_racedate_v1') || '2027-06-13';
const BASELINE = {
  weeklyHrs: 1.8,           // avg weekly training hours, trailing 8 weeks, as of Aug 27 2026
  runThresholdPace: '9:15/mi',   // rough estimate from Aug 18 run's embedded 5K/10K splits
  runThresholdMinPerMi: 9.25,
  swimPace100m: '1:43/100m',     // from your two most sustained swims (not a true CSS test)
  ftpKnown: false,
  maxHrObserved: 203,       // WHOOP-logged max (soccer), running max separately ~176
  runMaxHr: 176,
};

/* ---------------- PHASE / PROGRAM DEFINITION ---------------- */
const PHASES = [
  {key:'foundation', name:'Foundation', weeks:12, sessionsPerWeek:4,
   note:'Build the habit, fix swim technique, keep run/bike easy. Swim and bike get priority \u2014 they\'re furthest behind run in your logged volume.'},
  {key:'base', name:'Base Build', weeks:10, sessionsPerWeek:5,
   note:'Extend duration, introduce first bricks every 3rd week, add a real long run.'},
  {key:'build1', name:'Build 1', weeks:9, sessionsPerWeek:5,
   note:'Race-pace work using your actual thresholds, longer bricks every other week.'},
  {key:'build2', name:'Build 2 / Peak', weeks:10, sessionsPerWeek:5,
   note:'Peak volume, key long bricks matching race demands, tune-up race recommended mid-phase.'},
  {key:'taper', name:'Taper', weeks:3, sessionsPerWeek:4,
   note:'Cut volume, keep a little intensity, arrive fresh.'},
];
const TOTAL_WEEKS = PHASES.reduce((s,p)=>s+p.weeks,0);

function addDays(date, days){ const d = new Date(date); d.setDate(d.getDate()+days); return d; }
function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function lerp(min, max, t){ return Math.round(min + (max-min)*t); }
function ringSVG(pct, color, size){
  size = size || 92;
  const r = 38, c = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct||0));
  const dash = (clamped/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-dasharray="${dash} ${c}" stroke-linecap="round"
      transform="rotate(-90 50 50)" style="filter:drop-shadow(0 0 6px ${color});"/>
  </svg>`;
}

// Session templates per phase: {dayOffset (0=Mon), sport, title, durRange:[startMin,endMin], detail(w,totalW)=>string}
// Duration ranges are the WEEK-1 -> LAST-WEEK values for that phase; interpolated linearly across the phase.
function phaseTemplate(phaseKey){
  const rt = BASELINE.runThresholdPace, sp = BASELINE.swimPace100m;
  switch(phaseKey){
    case 'foundation': return [
      {day:0, sport:'Swim', title:'Swim Technique', type:'technique', dur:[20,35], detail:'Drills + easy aerobic. No pace target yet \u2014 focus on catch, body position, breathing. Reference pace once comfortable: aim toward ' + sp + '.'},
      {day:2, sport:'Run', title:'Easy Run', type:'easy', dur:[25,40], detail:`Conversational pace, well slower than threshold (${rt}) \u2014 target ~10:45\u201311:15/mi. Walk breaks fine.`},

/* ---------------- STRUCTURED WORKOUT BREAKDOWN (warm-up / main set / cooldown) ---------------- */
function buildStructure(sport, type, duration, brickDur){
  const rt = BASELINE.runThresholdPace, sp = BASELINE.swimPace100m;
  const wu = Math.min(12, Math.max(5, Math.round(duration*0.15)));
  const cd = Math.min(8, Math.max(3, Math.round(duration*0.10)));
  const main = Math.max(duration - wu - cd, 5);
  const segs = [];
  switch(type){
    case 'technique':
      segs.push({label:'Warm-up', text:`${Math.min(wu,8)} min easy swim + arm/shoulder mobility`});
      segs.push({label:'Main Set', text:`${main} min drill work (catch-up, fist drill, single-arm) alternated with easy continuous swimming. Focus on form, not speed.`});
      segs.push({label:'Cool-down', text:`${cd} min easy swim, relaxed`});
      break;
    case 'swimIntervals': {
      const reps = Math.max(4, Math.round(main/3));
      segs.push({label:'Warm-up', text:`150-200m easy + 4x25m build`});
      segs.push({label:'Main Set', text:`${reps} x 50-100m @ ${sp} pace, 15-20sec rest between reps`});
      segs.push({label:'Cool-down', text:`100m easy swim`});
      break; }
    case 'longSwim':
      segs.push({label:'Warm-up', text:`100-150m easy`});
      segs.push({label:'Main Set', text:`Continuous swim for ${main} min, steady effort. Negative split the last quarter if it feels good.`});
      segs.push({label:'Cool-down', text:`100m easy`});
      break;
    case 'racePaceSwim': {
      const reps = Math.max(3, Math.round(main/6));
      segs.push({label:'Warm-up', text:`150-200m easy + drills`});
      segs.push({label:'Main Set', text:`${reps} x 300-400m @ ${sp} race pace, 20-30sec rest \u2014 building toward continuous 1900m`});
      segs.push({label:'Cool-down', text:`100m easy`});
      break; }
    case 'taperSwim':
      segs.push({label:'Warm-up', text:`100m easy`});
      segs.push({label:'Main Set', text:`${main} min easy with 4-6 x 25m @ race pace touches, full recovery`});
      segs.push({label:'Cool-down', text:`50-100m easy`});
      break;
    case 'easy':
      segs.push({label:'Warm-up', text:`${wu} min easy building into pace`});
      segs.push({label:'Main Set', text:sport==='Run'
        ? `${main} min conversational pace, well slower than threshold (${rt})`
        : `${main} min Zone 2 effort \u2014 should be able to hold a conversation the whole time`});
      segs.push({label:'Cool-down', text:`${cd} min easy`});
      break;
    case 'strides':
      segs.push({label:'Warm-up', text:`${wu} min easy jog`});
      segs.push({label:'Main Set', text:`${Math.max(main-8,10)} min easy running with 4-6 x 20sec relaxed strides (fast but controlled) inserted, full recovery jog between each`});
      segs.push({label:'Cool-down', text:`${cd} min easy jog`});
      break;
    case 'tempo':
      segs.push({label:'Warm-up', text:`${wu} min easy jog + 3-4 strides`});
      segs.push({label:'Main Set', text:`${Math.max(main-5,15)} min continuous @ threshold pace (${rt})`});
      segs.push({label:'Cool-down', text:`${cd} min easy jog`});
      break;
    case 'runRacePace': {
      const reps = Math.max(4, Math.round(main/6));
      segs.push({label:'Warm-up', text:`${wu} min easy + drills + strides`});
      segs.push({label:'Main Set', text:`${reps} x 3-4 min @ threshold/race pace (${rt}), 90sec jog recovery between reps`});
      segs.push({label:'Cool-down', text:`${cd} min easy jog`});
      break; }
    case 'long':
      segs.push({label:'Warm-up', text:`5 min easy`});
      segs.push({label:'Main Set', text:`${main} min steady/easy pace, slower than ${rt}. Optional: last 10min slightly faster if legs feel good.`});
      segs.push({label:'Cool-down', text:`5 min walk`});
      break;
    case 'bikeIntervals': {
      const reps = Math.max(3, Math.round(main/8));
      segs.push({label:'Warm-up', text:`${wu} min easy spin, building cadence`});
      segs.push({label:'Main Set', text:`${reps} x 5 min hard effort (tempo/threshold by feel), 3 min easy spin recovery between`});
      segs.push({label:'Cool-down', text:`${cd} min easy spin`});
      break; }
    case 'bikeTempo':
      segs.push({label:'Warm-up', text:`${wu} min easy spin`});
      segs.push({label:'Main Set', text:`${main} min sustained tempo effort, race-simulation pacing`});
      segs.push({label:'Cool-down', text:`${cd} min easy spin`});
      break;
    case 'longBike':
      segs.push({label:'Warm-up', text:`10 min easy spin`});
      segs.push({label:'Main Set', text:`${main} min steady Zone 2, with 2-3 x 5min race-pace surges mixed in`});
      segs.push({label:'Cool-down', text:`10 min easy spin`});
      break;
    case 'taperBike':
      segs.push({label:'Warm-up', text:`5 min easy spin`});
      segs.push({label:'Main Set', text:`${main} min easy with 3 x 1min pickups`});
      segs.push({label:'Cool-down', text:`${cd} min easy spin`});
      break;
    case 'taperRun':
      segs.push({label:'Warm-up', text:`5 min easy jog`});
      segs.push({label:'Main Set', text:`${main} min easy with 3-4 x 20sec strides`});
      segs.push({label:'Cool-down', text:`${cd} min easy jog`});
      break;
    case 'keyBrick':
      segs.push({label:'Warm-up (Bike)', text:`10 min easy spin`});
      segs.push({label:'Main Set (Bike)', text:`${main} min at race-day bike effort \u2014 steady, sustainable, practice race nutrition/hydration`});
      segs.push({label:'Transition', text:`Quick change, aim under 3 min`});
      segs.push({label:'Run Off the Bike', text:`${brickDur} min @ race pace \u2014 legs will feel heavy for the first 5 min, that's normal. Focus on finding rhythm.`});
      break;
    case 'rest':
      segs.push({label:'Today', text:'Full rest or light mobility/stretching only. No structured training.'});
      break;
    default:
      segs.push({label:'Session', text:`${duration} min, effort per the notes above.`});
  }
  return segs;
}

function swapSuggestion(sport, type){
  const table = {
    technique:{easier:'Cut main set in half, extra rest between drills', harder:'Add 2-3 x 50m build-pace efforts at the end'},
    swimIntervals:{easier:'Fewer reps, longer rest (30sec)', harder:'Add 2 more reps or cut rest to 10sec'},
    longSwim:{easier:'Trim 10-15 min off, keep it fully easy', harder:'Add a negative-split final 200m at race pace'},
    racePaceSwim:{easier:'Reduce to shorter reps (150-200m) with more rest', harder:'Reduce rest to 15sec between reps'},
    taperSwim:{easier:'Skip the race-pace touches, all easy', harder:'Add 2 more 25m touches'},
    easy:{easier:'Trim 10-15 min off the main set', harder:'Add 10-15 min, still easy effort'},
    strides:{easier:'Drop to 3 strides, skip if legs feel heavy', harder:'Add 2 more strides, slightly longer (30sec)'},
    tempo:{easier:'Shorten tempo block by 5 min, same pace', harder:'Extend tempo block by 5-8 min'},
    runRacePace:{easier:'Drop 1-2 reps or extend recovery to 2 min', harder:'Add 1 more rep or cut recovery to 60sec'},
    long:{easier:'Trim 10-20% off duration, keep it easy', harder:'Add 10-15 min or a stronger final segment'},
    bikeIntervals:{easier:'Drop to shorter reps (3 min) with more recovery', harder:'Add 1 more rep or extend to 6-7 min each'},
    bikeTempo:{easier:'Shorten tempo block, ease off the effort slightly', harder:'Extend tempo block by 10 min'},
    longBike:{easier:'Trim 20-30 min, skip the surges', harder:'Add 20-30 min or an extra surge'},
    taperBike:{easier:'All easy, skip the pickups', harder:'Add 1-2 more short pickups'},
    taperRun:{easier:'Drop the strides, keep it fully easy', harder:'Add 1-2 more strides'},
    keyBrick:{easier:'Cut the bike portion by 30-45 min, keep the run off the bike the same', harder:'Extend the bike by 20-30 min before the run'},
    rest:{easier:'Full rest, no exceptions', harder:'A short 15-20 min walk is fine, nothing more'},
  };
  return table[type] || {easier:'Reduce duration by ~20%', harder:'Extend duration by ~15-20%'};
}

/* ---------------- DISTANCE / PACE / LOAD ESTIMATES (Stamina-style stat grid) ---------------- */
const RUN_PACE_MIN_PER_MI = {easy:10.75, strides:10.5, tempo:9.6, runRacePace:9.4, long:10.6, taperRun:10.75};
const BIKE_KPH = {easy:25, longBike:25, taperBike:24, bikeIntervals:28, bikeTempo:28, keyBrick:29};
const SWIM_PACE_MIN_PER_100M = {technique:2.0, swimIntervals:1.83, longSwim:1.9, racePaceSwim:1.72, taperSwim:1.95};
const LOAD_FACTOR = {technique:0.8, swimIntervals:1.5, longSwim:1.2, racePaceSwim:1.7, taperSwim:0.6,
  easy:1.0, strides:1.2, tempo:1.6, runRacePace:1.7, long:1.3, taperRun:0.6,
  bikeIntervals:1.6, bikeTempo:1.5, longBike:1.2, taperBike:0.6, keyBrick:1.9, rest:0};

function estimateDistance(sport, type, duration){
  if(sport==='Run'){
    const pace = RUN_PACE_MIN_PER_MI[type] || 10.5;
    const mi = duration/pace;
    return {distance: mi.toFixed(1), unit:'mi', km:(mi*1.60934).toFixed(1), paceLabel: fmtPaceMinPerMi(pace)+'/mi'};
  }
  if(sport==='Bike'){
    const kph = BIKE_KPH[type] || 25;
    const km = (duration/60)*kph;
    return {distance: km.toFixed(1), unit:'km', mi:(km/1.60934).toFixed(1), paceLabel: kph+' km/h avg'};
  }
  if(sport==='Swim'){
    const pace = SWIM_PACE_MIN_PER_100M[type] || 1.9;
    const m = Math.round((duration/pace)*100);
    return {distance: m, unit:'m', paceLabel: fmtPaceMinPerMi(pace)+'/100m'};
  }
  return null;
}
function fmtPaceMinPerMi(paceDecimal){
  const min = Math.floor(paceDecimal);
  const sec = Math.round((paceDecimal-min)*60);
  return `${min}:${String(sec).padStart(2,'0')}`;
}
function estimateLoad(sport, type, duration, brickDur){
  const factor = LOAD_FACTOR[type] ?? 1.0;
  const totalMin = duration + (brickDur||0);
  return Math.min(10, Math.round((totalMin/60) * factor * 2.2 * 10) / 10);
}


function buildProgram(){
  const race = new Date(RACE_DATE+'T00:00:00');
  const planStart = addDays(race, -TOTAL_WEEKS*7);
  // planStart is a Saturday-ish arbitrary date; snap to the Monday of that week for clean week boundaries
  const dow = planStart.getDay(); // 0=Sun..6=Sat
  const mondayOffset = dow===0 ? -6 : 1-dow;
  const start = addDays(planStart, mondayOffset);

  let weeks = [];
  let cursor = new Date(start);
  let globalWeekNum = 1;
  PHASES.forEach(phase=>{
    const template = phaseTemplate(phase.key);
    for(let w=0; w<phase.weeks; w++){
      const t = phase.weeks<=1 ? 0 : w/(phase.weeks-1);
      const weekStart = new Date(cursor);
      const sessions = [];
      template.forEach(s=>{
        let useTpl = s;
        if(s.altOdd && (w%2===1)) useTpl = {...s, ...s.altOdd};
        const dur = lerp(useTpl.dur[0], useTpl.dur[1], t);
        const date = addDays(weekStart, s.day);
        let isBrick = false, brickDur = 0;
        if(s.brickAlways){ isBrick = true; brickDur = lerp(s.brickDur[0], s.brickDur[1], t); }
        else if(s.brickEvery && (globalWeekNum % s.brickEvery === 0)){ isBrick = true; brickDur = 15; }
        sessions.push({
          date: isoDate(date), sport: useTpl.sport, title: useTpl.title, type: useTpl.type,
          duration: dur, detail: useTpl.detail, isBrick, brickDur,
          structure: buildStructure(useTpl.sport, useTpl.type, dur, brickDur),
          swap: swapSuggestion(useTpl.sport, useTpl.type),
          est: estimateDistance(useTpl.sport, useTpl.type, dur),
          load: estimateLoad(useTpl.sport, useTpl.type, dur, brickDur)
        });
      });
      weeks.push({weekNum: globalWeekNum, phase: phase.key, phaseName: phase.name, phaseNote: phase.note, start: isoDate(weekStart), sessions});
      cursor = addDays(cursor, 7);
      globalWeekNum++;
    }
  });
  return weeks;
}

const PROGRAM = buildProgram();

/* ---------------- SYNCED ACTUAL WORKOUTS (from workouts.json, same source as the Stats Dashboard) ---------------- */
let syncedWorkouts = [];
let syncOk = false;
async function loadSyncedActuals(){
  try{
    const res = await fetch('workouts.json', {cache:'no-store'});
    if(!res.ok) throw new Error('no workouts.json');
    const data = await res.json();
    syncedWorkouts = data.workouts || [];
    syncOk = true;
  }catch(e){
    syncedWorkouts = [];
    syncOk = false;
  }
}
// Real logged minutes for a given sport within [startDate, endDate] inclusive (both ISO strings)
function actualMinutes(sport, startDate, endDate){
  return syncedWorkouts
    .filter(w => w.sport===sport && w.date>=startDate && w.date<=endDate)
    .reduce((sum,w)=> sum + (w.duration||0), 0);
}
// Whether a real logged activity exists for this sport on this exact date (used to auto-check day cards)
function hasActualOnDate(sport, date){
  return syncedWorkouts.some(w => w.sport===sport && w.date===date);
}

const SPORT_HEX = {Swim:'#5ac8fa', Bike:'#ff2d95', Run:'#ff9500', Strength:'#9a9aa2', Rest:'#5a5a60'};
const SPORT_ICON = {Swim:'\u{1F3CA}', Bike:'\u{1F6B4}', Run:'\u{1F3C3}', Strength:'\u{1F3CB}', Rest:'\u{1F6CC}'};

/* ---------------- SESSION METRICS (load score, estimated pace/distance) ---------------- */
const PHASE_INTENSITY = {foundation:0.8, base:1.0, build1:1.15, build2:1.3, taper:0.7};
function fmtPace(decimalMinPerMi){
  const min = Math.floor(decimalMinPerMi);
  const sec = Math.round((decimalMinPerMi - min) * 60);
  return `${min}:${String(sec).padStart(2,'0')}`;
}
function sessionMetrics(s, phaseKey){
  const intensity = PHASE_INTENSITY[phaseKey] || 1;
  const totalMin = s.duration + (s.brickDur||0);
  const load = Math.min(10, Math.round((totalMin * intensity) / 22 * 10) / 10);
  let estPace = null, estDistance = null;
  if(s.sport==='Run'){
    const offset = (s.type==='easy'||s.type==='long') ? 1.75 : (s.type==='tempo'||s.type==='runRacePace') ? 0.1 : 1.0;
    const paceMin = BASELINE.runThresholdMinPerMi + offset;
    estPace = fmtPace(paceMin) + '/mi (est.)';
    estDistance = (s.duration / paceMin).toFixed(1) + ' mi (est.)';
  } else if(s.sport==='Swim'){
    const paceSec = 103; // ~1:43/100m in seconds, rough
    estDistance = Math.round((s.duration*60/paceSec)*100) + ' m (est.)';
    estPace = BASELINE.swimPace100m + ' (est.)';
  } else if(s.sport==='Bike'){
    estPace = 'Effort-based \u2014 no FTP yet';
    estDistance = Math.round(s.duration * 0.31) + ' km (est. @ easy pace)';
  }
  return {load, estPace, estDistance};
}

    </div>
    <div class="wn-nav">
      <div class="wn-arrow ${atStart?'disabled':''}" onclick="changeWeek(-1)">&lsaquo;</div>
      <div class="wn-center">
        <div class="wn-week">Week ${week.weekNum}<span> /${TOTAL_WEEKS}</span></div>
        <div class="wn-phase" style="color:${{foundation:'#7cb3ff',base:'#7cb3ff',build1:'#ffb648',build2:'#ff8a80',taper:'#b3a6ff'}[week.phase]};">${isCurrentWeek?'\u{1F4CD} ':''}${week.phaseName.toUpperCase()} PHASE</div>
      </div>
      <div class="wn-arrow ${atEnd?'disabled':''}" onclick="changeWeek(1)">&rsaquo;</div>
    </div>
    <div class="sport-ring-row">${ringsHtml}</div>
    <div class="total-duration">\u23F1\uFE0F Total duration: <b>${fmtHM(totalDone)}</b> / ${fmtHM(totalTarget)}</div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px;">${syncOk ? '\u2713 Progress from your synced Strava data' : '\u26a0 workouts.json not found \u2014 progress shows 0 until synced'}</div>`;

  renderDayList(week, todayStr);
}

/* ---------------- RENDER: DAY LIST (Stamina-style workout cards) ---------------- */
function renderDayList(week, todayStr){
  const el = document.getElementById('dayList');
  const days = [];
  for(let i=0;i<7;i++){
    const d = addDays(new Date(week.start+'T00:00:00'), i);
    const dateStr = isoDate(d);
    const session = week.sessions.find(s=>s.date===dateStr);
    days.push({date:dateStr, d, session});
  }
  el.innerHTML = days.map((day,idx)=>{
    const isToday = day.date===todayStr;
    const dayLabel = day.d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
    if(!day.session){
      return `<div class="day-row">
        <div class="day-row-head ${isToday?'is-today':''}">${isToday?'TODAY \u00b7 ':''}${dayLabel}</div>
        <div class="rest-mini">\u{1F6CC} Rest day \u2014 no prescribed session.</div>
      </div>`;
    }
    const s = day.session;
    const key = sessionKey(s);
    const autoDone = hasActualOnDate(s.sport, s.date);
    const isDone = !!doneMap[key] || autoDone;
    const m = sessionMetrics(s, week.phase);
    const structId = `dstruct-${idx}`;
    const structHtml = (s.structure||[]).map(seg=>`
      <div class="wo-seg"><div class="wo-seg-label">${seg.label}</div><div class="wo-seg-text">${seg.text}</div></div>`).join('');
    const swapHtml = s.swap ? `
      <div class="swap-row">
        <div class="swap-box"><div class="swap-label">If it's too much</div><div class="swap-text">${s.swap.easier}</div></div>
        <div class="swap-box"><div class="swap-label">If you want more</div><div class="swap-text">${s.swap.harder}</div></div>
      </div>` : '';
    const coachTip = s.structure && s.structure.length ? s.structure[s.structure.length>2?1:0].text : s.detail;
    return `<div class="day-row">
      <div class="day-row-head ${isToday?'is-today':''}">${isToday?'TODAY \u00b7 ':''}${dayLabel}</div>
      <div class="wo-card ${isDone?'completed':''}" onclick="document.getElementById('${structId}').classList.toggle('open')">
        <div class="wo-card-top">
          <div class="wo-card-title">
            <div class="wo-icon" style="background:${SPORT_HEX[s.sport]}33;">${SPORT_ICON[s.sport]}</div>
            <span>${s.title}${s.isBrick?' + Brick':''}</span>
          </div>
          <span class="wo-check" ${autoDone ? `title="Matched to your synced Strava activity"` : `onclick="event.stopPropagation();toggleDone('${key}')" style="cursor:pointer;"`}>${autoDone ? '\u2705 synced' : (isDone?'\u2705':'\u2b1c')}</span>
        </div>
        <div class="wo-tags">
          <span class="wo-tag" style="background:rgba(139,124,240,0.2);color:#b3a6ff;">${week.phaseName}</span>
          <span class="wo-tag" style="background:${SPORT_HEX[s.sport]}22;color:${SPORT_HEX[s.sport]};">${s.sport.toUpperCase()}</span>
        </div>
        <div class="wo-stats-row">
          <div class="wo-stat"><div class="wo-stat-label">\u23F1\uFE0F Est. Time</div><div class="wo-stat-val">${s.duration}<span class="unit"> min</span></div></div>
          ${m.estDistance ? `<div class="wo-stat"><div class="wo-stat-label">\u{1F4CF} Distance</div><div class="wo-stat-val">${m.estDistance}</div></div>` : ''}
          <div class="wo-stat"><div class="wo-stat-label">\u{1F3AF} Est. Pace</div><div class="wo-stat-val" style="font-size:11px;">${m.estPace||'\u2014'}</div></div>
          <div class="wo-stat"><div class="wo-stat-label">\u26F0\uFE0F Load</div><div class="wo-stat-val">${m.load}<span class="unit">/10</span></div></div>
        </div>
        <div class="wo-structure sess-struct" id="${structId}">
          ${structHtml}
          ${swapHtml}
          <div class="coach-card">
            <div class="coach-head"><div class="coach-avatar">C</div>Coach's note</div>
            <div class="coach-text">${coachTip}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}


/* ---------------- RENDER: ROADMAP CHART ---------------- */
let roadmapChart;
function renderRoadmap(){
  const labels = PROGRAM.map(w=>'W'+w.weekNum);
  const hours = PROGRAM.map(w=> +(w.sessions.reduce((s,x)=>s+x.duration+(x.brickDur||0),0)/60).toFixed(1));
  const todayStr = new Date().toISOString().slice(0,10);
  const currentWeek = findWeekForDate(todayStr);
  const pointColors = PROGRAM.map(w=> currentWeek && w.weekNum===currentWeek.weekNum ? '#ff6a3d' : '#4d94ff');
  if(roadmapChart) roadmapChart.destroy();
  roadmapChart = new Chart(document.getElementById('roadmapChart'), {
    type:'line',
    data:{labels, datasets:[{label:'Planned hours/week', data:hours, borderColor:'#4d94ff', backgroundColor:'rgba(77,148,255,0.1)', tension:0.3, fill:true, pointRadius:2, pointBackgroundColor:pointColors}]},
    options:{responsive:true,
      scales:{
        x:{ticks:{color:'#9a9aa2',font:{size:9},maxTicksLimit:12}, grid:{color:'#2e2e34'}},
        y:{ticks:{color:'#9a9aa2'}, grid:{color:'#2e2e34'}, title:{display:true,text:'hrs',color:'#9a9aa2'}}
      },
      plugins:{legend:{display:false}}
    }
  });
}

/* ---------------- RENDER: FULL PROGRAM ACCORDION ---------------- */
function weekLoad(w){
  // simple training-load proxy: total minutes weighted by phase intensity
  const intensity = {foundation:0.8, base:1.0, build1:1.15, build2:1.3, taper:0.7}[w.phase] || 1;
  const totalMin = w.sessions.reduce((s,x)=>s+x.duration+(x.brickDur||0),0);
  return Math.round(totalMin * intensity);
}
function renderAccordion(){
  const el = document.getElementById('phaseAccordions');
  const byPhase = {};
  PROGRAM.forEach(w=>{ (byPhase[w.phase] = byPhase[w.phase]||[]).push(w); });
  const todayStr = new Date().toISOString().slice(0,10);
  const currentWeek = findWeekForDate(todayStr);
  const allLoads = PROGRAM.map(weekLoad);
  const maxLoad = Math.max(...allLoads, 1);

  el.innerHTML = PHASES.map(phase=>{
    const weeks = byPhase[phase.key];
    const start = weeks[0].start, end = isoDate(addDays(new Date(weeks[weeks.length-1].start+'T00:00:00'),6));
    const avgHrsWk = (weeks.reduce((s,w)=>s+w.sessions.reduce((ss,x)=>ss+x.duration+(x.brickDur||0),0),0)/weeks.length/60).toFixed(1);
    const isCurrentPhase = currentWeek && currentWeek.phase===phase.key;
    const weeksHtml = weeks.map(w=>{
      const load = weekLoad(w);
      const barPct = Math.round((load/maxLoad)*100);
      const isCurrent = currentWeek && w.weekNum===currentWeek.weekNum;
      const hrs = (w.sessions.reduce((s,x)=>s+x.duration+(x.brickDur||0),0)/60).toFixed(1);
      return `
      <div class="week-row-v2 ${isCurrent?'is-current':''}" id="week-${w.weekNum}">
        <div class="wlh"><span class="wname">Week ${w.weekNum} &middot; ${fmtDate(new Date(w.start+'T00:00:00'))} &middot; ${hrs}h</span><span class="wload">${load}</span></div>
        <div class="wload-bar"><div class="wload-bar-fill" style="width:${barPct}%;"></div></div>
        ${w.sessions.map((s,si)=>{
          const structId = `struct-${w.weekNum}-${si}`;
          const structMini = (s.structure||[]).map(seg=>`<div class="wo-seg" style="padding:5px 0;"><div class="wo-seg-label" style="flex-basis:78px;font-size:9.5px;">${seg.label}</div><div class="wo-seg-text" style="font-size:11.5px;">${seg.text}</div></div>`).join('');
          return `<div class="sess-line-wrap">
            <div class="sess-line" style="cursor:pointer;" onclick="document.getElementById('${structId}').classList.toggle('open')">
              <span class="sname">${s.sport}: ${s.title}${s.isBrick?' + Brick':''}</span>
              <span class="sdur">${s.duration}${s.isBrick?'+'+s.brickDur:''} min</span>
            </div>
            <div class="sess-struct" id="${structId}">${structMini}</div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
    return `<div class="phase-accordion" ${isCurrentPhase?'style="border-color:var(--cyan);"':''}>
      <div class="phase-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <div>
          <span class="phase-badge ${phase.key}">${phase.name}</span>
          <div class="pdate" style="margin-top:6px;">${fmtDate(new Date(start+'T00:00:00'))} \u2192 ${fmtDate(new Date(end+'T00:00:00'))} &middot; ${phase.note}</div>
        </div>
        <div class="mono" style="color:var(--muted);font-size:11px;white-space:nowrap;">${weeks.length}wk &middot; ${avgHrsWk}h/wk</div>
      </div>
      <div class="phase-body">${weeksHtml}</div>
    </div>`;
  }).join('');
}

document.getElementById('jumpToday').addEventListener('click', ()=>{
  const todayStr = new Date().toISOString().slice(0,10);
  const week = findWeekForDate(todayStr);
  if(!week) return;
  document.querySelectorAll('.phase-body').forEach(b=>b.classList.add('open'));
  setTimeout(()=>{
    const target = document.getElementById('week-'+week.weekNum);
    if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
  }, 50);
});

function renderAll(){
  renderWeekView();
  renderBaseline();
  renderRoadmap();
  renderAccordion();
  autoExpandCurrentPhase();
}
function autoExpandCurrentPhase(){
  const todayStr = new Date().toISOString().slice(0,10);
  const currentWeek = findWeekForDate(todayStr);
  if(!currentWeek) return;
  const accordions = document.querySelectorAll('.phase-accordion');
  const byPhase = {};
  PROGRAM.forEach(w=>{ (byPhase[w.phase] = byPhase[w.phase]||[]).push(w); });
  const phaseKeys = Object.keys(byPhase);
  const idx = PHASES.findIndex(p=>p.key===currentWeek.phase);
  if(idx>=0 && accordions[idx]){
    accordions[idx].querySelector('.phase-body').classList.add('open');
  }
}
async function init(){
  await loadSyncedActuals();
  renderAll();
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
